services:
  kokoro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kokoro-server
    restart: unless-stopped
    ports:
      - "8179:8179"
    volumes:
    # Persist downloaded model/voice files on the host to avoid re-downloading on restart.
      - ./models:/app/models
    environment:
      # fp16 (169MB, default) | int8 (kokoro-v1.0.int8.onnx, 88MB) | f32 (kokoro-v1.0.onnx, 310MB)
      KOKORO_MODEL_FILE: kokoro-v1.0.fp16.onnx
      KOKORO_VOICES_FILE: voices-v1.0.bin
      KOKORO_VOICE: af_heart      # US: af_*/am_*  |  UK: bf_*/bm_*
      KOKORO_LANG: en-us
      KOKORO_SPEED: "1.0"
      KOKORO_HOST: 0.0.0.0
      KOKORO_PORT: "8179"
      KOKORO_THREADS: "4"         # match the number of cores on the M910q
    mem_limit: 2g                 # guardrail to keep TTS from starving the host
    networks:
      - kokoro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8179/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s          # first run downloads the model

networks:
  # Standalone bridge network. To share this server with other containers,
  # attach them to "kokoro-tts-network", or make this block external and point
  # it at an existing network (see README → Connecting from Another Container).
  kokoro-network:
    name: kokoro-tts-network
